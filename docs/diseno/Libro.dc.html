<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lunacuento · Libro abierto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFF8E7}a:hover{color:#FFE6A3}
.disp{font-family:'Fredoka',ui-rounded,'Trebuchet MS',sans-serif}
.round{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;border:0;background:#333F93;color:#FFF8E7;box-shadow:0 4px 0 #1C2463}
.pill{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 22px;border-radius:999px;border:0;font:700 17px 'Atkinson Hyperlegible',system-ui,sans-serif}
.w-on{background:#FFB703;color:#3A2600;border-radius:8px;padding:0 6px;box-shadow:0 3px 0 #D18A00}
</style>
</helmet>
<div style="width:1440px;height:900px;box-sizing:border-box;background:#27317A;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:#FFF8E7;display:flex;flex-direction:column;position:relative;overflow:hidden">

  <!-- estrellas de fondo -->
  <svg aria-hidden="true" viewBox="0 0 1440 900" style="position:absolute;inset:0;width:1440px;height:900px">
    <g fill="#FFF8E7" opacity=".55"><circle cx="80" cy="140" r="2"></circle><circle cx="200" cy="820" r="2"></circle><circle cx="1360" cy="160" r="2"></circle><circle cx="1300" cy="800" r="2.5"></circle><circle cx="60" cy="560" r="1.5"></circle><circle cx="1400" cy="520" r="1.5"></circle><circle cx="700" cy="860" r="1.5"></circle></g>
  </svg>

  <!-- barra superior -->
  <div style="position:relative;z-index:2;display:flex;align-items:center;gap:16px;padding:22px 40px">
    <a href="Main.dc.html" class="round" aria-label="Cerrar el libro">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="margin-left:8px">
      <p class="disp" style="margin:0;font-size:26px;font-weight:600">La lámpara de la luna</p>
      <p style="margin:2px 0 0;font-size:14px;color:#CBD0F5">para Emilia</p>
    </div>
    <div style="margin-left:auto;display:flex;gap:12px;align-items:center">
      <button type="button" class="pill" style="background:#333F93;color:#FFF8E7;box-shadow:0 4px 0 #1C2463">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5z"></path></svg>
        Modo dormir
      </button>
      <label for="timer" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Apagar en</label>
      <select id="timer" style="min-height:52px;padding:0 18px;border-radius:999px;border:2px solid #4A57A8;background:#27317A;color:#FFF8E7;font:700 16px 'Atkinson Hyperlegible',sans-serif">
        <option>Apagar en 10 min</option><option>Apagar en 20 min</option><option>Sin apagar</option>
      </select>
      <button type="button" class="pill" style="background:#FFB703;color:#3A2600;box-shadow:0 5px 0 #D18A00">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"></rect><rect x="14" y="5" width="4" height="14" rx="1.5"></rect></svg>
        Pausa
      </button>
    </div>
  </div>

  <!-- el libro -->
  <div style="position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;perspective:2400px">
    <div style="position:relative;width:1120px;height:660px;padding:16px;box-sizing:border-box;background:#2F3E9E;border-radius:14px 22px 22px 14px;display:flex;box-shadow:inset 0 0 0 3px rgba(255,255,255,.12),0 40px 0 -14px #1C2463,0 50px 80px -30px rgba(0,0,0,.6)">

      <!-- página izquierda: ilustración -->
      <div style="flex:1;position:relative;background:#FFFDF6;border-radius:8px 2px 2px 8px;padding:20px 22px 44px;box-shadow:-2px 0 0 #EADFC6,-4px 0 0 #FFFDF6,-6px 0 0 #EADFC6,-8px 0 0 #FFFDF6,-10px 0 0 #D9C9A6">
        <svg viewBox="0 0 400 300" aria-hidden="true" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;border-radius:12px">
          <rect width="400" height="300" fill="#1E2A6E"></rect>
          <g fill="#FFF8E7"><circle cx="40" cy="40" r="1.8"></circle><circle cx="120" cy="80" r="1.4"></circle><circle cx="200" cy="30" r="1.8"></circle><circle cx="250" cy="110" r="1.3"></circle><circle cx="70" cy="130" r="1.5"></circle><circle cx="380" cy="150" r="1.4"></circle></g>
          <circle cx="315" cy="70" r="50" fill="#FFD966" opacity=".22"></circle>
          <circle cx="315" cy="70" r="33" fill="#FFE08A"></circle>
          <path d="M0 225 Q90 180 190 215 T400 200 V300 H0Z" fill="#24467A"></path>
          <path d="M0 255 Q120 225 240 250 T400 245 V300 H0Z" fill="#1B3763"></path>
          <circle cx="170" cy="170" r="16" fill="#FFC93C" opacity=".35"></circle><circle cx="170" cy="170" r="3" fill="#FFF8D0"></circle>
          <circle cx="250" cy="200" r="13" fill="#FFC93C" opacity=".35"></circle><circle cx="250" cy="200" r="2.5" fill="#FFF8D0"></circle>
          <circle cx="120" cy="215" r="12" fill="#FFC93C" opacity=".35"></circle><circle cx="120" cy="215" r="2.4" fill="#FFF8D0"></circle>
        </svg>
        <span style="position:absolute;left:26px;bottom:14px;font-size:14px;color:#8D8AA6">9</span>
        <!-- sombra del lomo -->
        <div aria-hidden="true" style="position:absolute;top:0;right:0;bottom:0;width:70px;background:linear-gradient(to left,rgba(43,45,82,.18),rgba(43,45,82,0))"></div>
      </div>

      <!-- página derecha: texto -->
      <div style="flex:1;position:relative;background:#FFFDF6;border-radius:2px 8px 8px 2px;padding:56px 64px;display:flex;flex-direction:column;justify-content:center;box-shadow:2px 0 0 #EADFC6,4px 0 0 #FFFDF6,6px 0 0 #EADFC6,8px 0 0 #FFFDF6,10px 0 0 #D9C9A6">
        <div aria-hidden="true" style="position:absolute;top:0;left:0;bottom:0;width:60px;background:linear-gradient(to right,rgba(43,45,82,.16),rgba(43,45,82,0))"></div>
        <p class="disp" style="margin:0;font-size:36px;line-height:1.5;color:#2B2D52;font-weight:500">Arriba, la luna encendió su <span class="w-on">lámpara</span> redonda. —Ella cuida a todos mientras duermen —susurró Lía.</p>
        <span style="position:absolute;right:30px;bottom:14px;font-size:14px;color:#8D8AA6">10</span>
      </div>

      <!-- hoja a medio pasar (sigue el dedo) -->
      <div aria-hidden="true" style="position:absolute;top:16px;bottom:16px;left:50%;width:calc(50% - 16px);transform-origin:left center;transform:rotateY(-34deg);transform-style:preserve-3d">
        <div style="position:absolute;inset:0;background:#FFFDF6;border-radius:2px 8px 8px 2px;padding:56px 64px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;box-shadow:-30px 0 50px -20px rgba(28,36,99,.55)">
          <p class="disp" style="margin:0;font-size:36px;line-height:1.5;color:#2B2D52;font-weight:500;opacity:.9">—La noche no está vacía —dijo Lía—. Está llena de cosas que descansan, igual que tú.</p>
          <div style="position:absolute;inset:0;border-radius:2px 8px 8px 2px;background:linear-gradient(to left,rgba(43,45,82,.28),rgba(43,45,82,0) 55%)"></div>
        </div>
      </div>

      <!-- dedo que arrastra -->
      <div aria-hidden="true" style="position:absolute;right:180px;bottom:120px;width:74px;height:74px;border-radius:50%;background:rgba(255,183,3,.28);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 12px rgba(255,183,3,.12)">
        <div style="width:28px;height:28px;border-radius:50%;background:#FFB703;box-shadow:0 3px 0 #D18A00"></div>
      </div>
    </div>
  </div>

  <!-- barra inferior -->
  <div style="position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:28px;padding:18px 40px 28px">
    <button type="button" class="round" aria-label="Página anterior" style="width:64px;height:64px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div style="display:flex;gap:8px;align-items:center" aria-label="Página 5 de 6">
      <span style="width:12px;height:12px;border-radius:6px;background:#4A57A8"></span>
      <span style="width:12px;height:12px;border-radius:6px;background:#4A57A8"></span>
      <span style="width:12px;height:12px;border-radius:6px;background:#4A57A8"></span>
      <span style="width:12px;height:12px;border-radius:6px;background:#4A57A8"></span>
      <span style="width:36px;height:12px;border-radius:6px;background:#FFB703"></span>
      <span style="width:12px;height:12px;border-radius:6px;background:#4A57A8"></span>
    </div>
    <button type="button" class="round" aria-label="Página siguiente" style="width:64px;height:64px;background:#FFB703;color:#3A2600;box-shadow:0 5px 0 #D18A00">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
    <span style="position:absolute;right:40px;font-size:15px;color:#CBD0F5">Desliza la página con el dedo</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
